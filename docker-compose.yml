version: '3.8'

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: saark_erp_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PROVIDER=sqlite
      - DATABASE_URL=file:../../storage/saark_erp.db
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_BASE_PATH=../../storage
      - JWT_SECRET=saark_erp_production_jwt_secret_key_2026_x98123
    volumes:
      - ./storage:/app/storage

