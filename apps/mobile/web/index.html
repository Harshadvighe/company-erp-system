<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Saark ERP Platform. Streamlined operations across CRM, Production, HR, Inventory, Purchase, and Finance.">
  <meta name="theme-color" content="#F15A24">

  <!-- Open Graph / Meta -->
  <meta property="og:title" content="SAARK ERP">
  <meta property="og:description" content="Integrated Enterprise Resource Planning for Saark Exploration Private Limited.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SAARK ERP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SAARK ERP</title>
  <link rel="manifest" href="manifest.json">

  <!-- Typography Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0F1115;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* Branded High-Performance Splash Screen */
    #app-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #181B22 0%, #0A0C0F 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s ease-out, visibility 0.4s;
    }

    #app-loading-screen.dismissed {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .splash-logo-container {
      position: relative;
      width: 84px;
      height: 84px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-spinner {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(241, 90, 36, 0.15);
      border-top-color: #F15A24;
      border-right-color: #FF7A45;
      animation: splash-spin 1.1s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }

    .splash-logo-inner {
      width: 52px;
      height: 52px;
      background: #1C1F26;
      border: 1px solid rgba(241, 90, 36, 0.4);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(241, 90, 36, 0.25);
    }

    .splash-logo-text {
      color: #F15A24;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .splash-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .splash-company {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #F15A24;
      margin-bottom: 18px;
    }

    .splash-progress-track {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }

    .splash-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #F15A24, #FF8800);
      border-radius: 3px;
      animation: splash-pulse-bar 1.5s ease-in-out infinite alternate;
    }

    .splash-status {
      font-size: 10.5px;
      letter-spacing: 1.5px;
      color: #8C93A0;
      text-transform: uppercase;
    }

    @keyframes splash-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes splash-pulse-bar {
      0% { left: 0%; width: 30%; }
      100% { left: 70%; width: 30%; }
    }
  </style>
</head>
<body>
  <!-- Branded Splash Screen -->
  <div id="app-loading-screen">
    <div class="splash-card">
      <div class="splash-logo-container">
        <div class="splash-spinner"></div>
        <div class="splash-logo-inner">
          <span class="splash-logo-text">SE</span>
        </div>
      </div>
      <div class="splash-title" style="color: #F15A24;">SAARK ERP</div>
      <div class="splash-company">SAARK EXPLORATION PVT. LTD.</div>
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
      <div class="splash-status">INITIALIZING SYSTEM...</div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
